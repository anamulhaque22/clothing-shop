name: euphoria
services:
  server:
    build:
      context: ./
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=${NODE_ENV}
        - APP_PORT=${APP_PORT}
    env_file:
      - ./.env
    ports:
      - '${APP_PORT}:${APP_PORT}'
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          'http://localhost:${APP_PORT}/${API_PREFIX}/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:
