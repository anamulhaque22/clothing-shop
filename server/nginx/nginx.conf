events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server api:3000;
    }

    server {
        listen 80;
        server_name anamul-shop-store.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name anamul-shop-store.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/anamul-shop-store.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anamul-shop-store.duckdns.org/privkey.pem;

        location /health {
            proxy_pass http://api_backend/health;
        }

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}