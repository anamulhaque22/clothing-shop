name: euphoria

services:
  server:
    build:
      context: ./
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENV=${NODE_ENV}
        - APP_PORT=${APP_PORT}
    env_file:
      - ./.env
    environment:
      DATABASE_HOST: postgres
    ports:
      - '${APP_PORT}:${APP_PORT}'
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          'http://localhost:${APP_PORT}/${API_PREFIX}/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: yarn start:dev
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    env_file:
      - ./.env
    # expose:
    #   - '${DATABASE_PORT}'
    ports:
      - '${DATABASE_PORT}:${DATABASE_PORT}'
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $$DATABASE_USERNAME -d $$DATABASE_NAME']
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 20s

volumes:
  db-data:
networks:
  backend:
