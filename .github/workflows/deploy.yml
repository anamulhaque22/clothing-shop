name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/server:${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            "${{ env.IMAGE }}"
            "ghcr.io/${{ github.repository }}/server:latest"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    environment: production-server
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Encode environment variables
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          B64=$(printf '%s' "$PROD_ENV_FILE" | base64 -w0)
          echo "::add-mask::$B64"
          echo "ENV_B64=$B64" >> "$GITHUB_ENV"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USER }}
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          port: ${{ secrets.EC2_PROD_PORT }}
          source: "server/docker-compose.prod.yml,server/nginx/nginx.conf,server/deploy.sh"
          target: "/home/${{ secrets.EC2_PROD_USER }}/euphoria-server"
          strip_components: 1

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_B64: ${{ env.ENV_B64 }}
          IMAGE: ${{ env.IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USER }}
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          port: ${{ secrets.EC2_PROD_PORT }}
          envs: ENV_B64,IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            cd /home/${{ secrets.EC2_PROD_USER }}/euphoria-server
            bash deploy.sh
